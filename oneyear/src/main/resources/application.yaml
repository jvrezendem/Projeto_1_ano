spring:
  application:
    name: oneyear
  config:
    import:
      - optional:file:${APP_PRIVATE_CONFIG:./config/private.yaml}
      - optional:file:./.env[.properties]
      - optional:file:./oneyear/.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${APP_COOKIE_SECURE:true}
        same-site: lax

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  armazenamento:
    tipo: neon
    endpoint: ${NEON_STORAGE_ENDPOINT:}
    regiao: ${NEON_STORAGE_REGION:us-east-2}
    bucket: ${NEON_STORAGE_BUCKET:}
    access-key: ${NEON_STORAGE_ACCESS_KEY:}
    secret-key: ${NEON_STORAGE_SECRET_KEY:}
    path-style: ${NEON_STORAGE_PATH_STYLE:true}
  usuarios:
    provisionar: true
    primeira:
      login: ${USUARIO_1_LOGIN:}
      senha-hash: ${USUARIO_1_SENHA_HASH:}
      nome: ${USUARIO_1_NOME:}
      avatar-key: ${USUARIO_1_AVATAR_KEY:}
      descricao: ${USUARIO_1_DESCRICAO:}
      caracteristicas: ${USUARIO_1_CARACTERISTICAS:}
    segunda:
      login: ${USUARIO_2_LOGIN:}
      senha-hash: ${USUARIO_2_SENHA_HASH:}
      nome: ${USUARIO_2_NOME:}
      avatar-key: ${USUARIO_2_AVATAR_KEY:}
      descricao: ${USUARIO_2_DESCRICAO:}
      caracteristicas: ${USUARIO_2_CARACTERISTICAS:}
  historia:
    frase-principal: ${HISTORIA_FRASE_PRINCIPAL:}
    introducao: ${HISTORIA_INTRODUCAO:}
    dicas: ${HISTORIA_DICAS:}
